<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173A61">
<title>METAS NOVAS — Grupo Uoma</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--ground:#FAF8F4;--surface:#FFFFFF;--surface-2:#F3F0EA;--field:#FFFFFF;--ink:#182333;--muted:#5F6A78;--line:#E5E0D6;--line-2:#D8D2C6;--navy:#173A61;--navy-soft:#E9EFF6;--gold:#A9791F;--gold-soft:#F6ECD4;--good:#1C7A49;--good-soft:#E4F2EA;--radius:13px;--shadow:0 1px 2px rgba(20,30,45,.05),0 10px 26px rgba(20,30,45,.06)}
  @media (prefers-color-scheme:dark){:root{--ground:#0E141C;--surface:#161F2B;--surface-2:#1B2531;--field:#101822;--ink:#E9EDF3;--muted:#9BA6B4;--line:#26313F;--line-2:#33404F;--navy:#7CA3D6;--navy-soft:#1A2A3D;--gold:#D7B15C;--gold-soft:#2A2413;--good:#54BE88;--good-soft:#13291E;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4)}}
  *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--ground);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
  .num{font-variant-numeric:tabular-nums}
  .wrap{max-width:900px;margin:0 auto;padding:0 0 90px}
  .top{background:linear-gradient(135deg,#0F2942,var(--navy));color:#fff;padding:18px 18px 16px}
  .top .brand{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
  .top .logo{width:30px;height:30px;border-radius:8px;background:#fff;display:grid;place-items:center;font-size:16px}
  .top h1{margin:10px 0 2px;font-size:22px}
  .top .who{font-size:12.5px;opacity:.9}
  .tabs{position:sticky;top:0;z-index:10;display:flex;gap:6px;background:var(--ground);border-bottom:1px solid var(--line);padding:10px 14px;overflow-x:auto}
  .tabs button{flex:none;font-family:inherit;font-size:13px;font-weight:700;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
  .tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  @media (prefers-color-scheme:dark){.tabs button.on{color:#0c1420}}
  .pad{padding:16px 16px 0}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;margin:0 0 14px}
  .seg button{font-family:inherit;font-size:13px;font-weight:700;padding:8px 16px;border:none;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin:0 0 14px;overflow:hidden}
  .grph{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid var(--line)}
  .grph h3{margin:0;font-size:15px;font-weight:800;flex:1}
  .grpb{padding:6px 15px 15px}
  .fr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .fr:last-child{border-bottom:none}
  .fr .lab{flex:1;font-size:13.5px}
  .fr .lab .d{font-size:11px;color:var(--muted)}
  input.f,select.f{font-family:inherit;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--field);border:1.5px solid var(--line-2);border-radius:9px;padding:8px 10px;width:110px;text-align:right}
  select.f{text-align:left;width:auto}
  input.f:focus,select.f:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
  input[type=checkbox]{width:20px;height:20px;accent-color:var(--good)}
  .subhead{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);font-weight:700;padding:12px 0 2px}
  .btn{font-family:inherit;font-size:14px;font-weight:800;padding:11px 18px;border-radius:10px;border:none;cursor:pointer;background:var(--navy);color:#fff}
  @media (prefers-color-scheme:dark){.btn{color:#0c1420}}
  .btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line-2)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .fzrow{display:grid;grid-template-columns:1.4fr .9fr .8fr .8fr auto;gap:7px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
  .fzrow input.f,.fzrow select.f{width:100%}
  .fzh{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .rm{background:transparent;border:none;color:var(--muted);font-size:16px;cursor:pointer}
  .msg{font-size:12.5px;color:var(--muted);padding:10px 0}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:28px;border:1px dashed var(--line);border-radius:12px}
  .center{max-width:420px;margin:60px auto;padding:0 20px;text-align:center}
  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:11px 16px;display:flex;gap:12px;align-items:center;max-width:900px;margin:0 auto}
  .savebar .m{flex:1;font-size:12px;color:var(--muted)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;background:var(--ink);color:var(--ground);font-size:12.5px;font-weight:600;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:40;max-width:88%;text-align:center}
  .toast.on{opacity:1}
  .gate{font-size:10.5px;font-weight:700;color:var(--navy);background:var(--navy-soft);padding:4px 9px;border-radius:999px}
  .critcard{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin:0 0 9px}
  .critcard .ch{display:flex;gap:7px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .critcard .ch select{flex:1;min-width:110px}
  .podio{display:flex;gap:8px;flex-wrap:wrap}
  .podio .pp{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700}.podio .pp input{width:76px}
  .addc{width:100%;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--navy);background:var(--navy-soft);border:1px dashed color-mix(in srgb,var(--navy) 35%,transparent);border-radius:9px;padding:10px;cursor:pointer}
  .uploader{border:1.5px dashed var(--line-2);border-radius:12px;padding:14px;text-align:center;cursor:pointer;background:var(--surface-2);margin:6px 0}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:center}
  .thumb{position:relative;width:66px;height:66px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;font-size:11px;cursor:pointer;line-height:1}
  .rmini{display:flex;flex-direction:column;gap:5px}
  .rmini .r{display:flex;align-items:center;gap:8px;font-size:12px;flex-wrap:wrap}
  .rmini .r .nm{font-weight:700}.rmini .r .md{font-size:10.5px;color:var(--navy);background:var(--navy-soft);padding:1px 6px;border-radius:5px;font-weight:700}
  .rmini .r .pz{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;background:var(--gold-soft);padding:2px 7px;border-radius:6px;font-size:11px}
  .clist .ci{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .clist .ci:last-child{border-bottom:none}
  .clink{font-size:11.5px;word-break:break-all;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:4px 0}
  .kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
  .kbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 13px}
  .kbox .kl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .kbox .kv{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
  .kbox .ks{font-size:11px;color:var(--muted);margin-top:1px}
  .kbox .kv.gold{color:var(--gold)}
  .tl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .tl:last-child{border-bottom:none}
  .tl .rk{width:20px;color:var(--muted);font-weight:700;font-size:11px;flex:none;text-align:right}
  .tl .nm{flex:1;font-weight:600}.tl .nm .d{font-size:11px;color:var(--muted);font-weight:400}
  .tl .vv{font-variant-numeric:tabular-nums;font-weight:800}
  .tl .vv .u{font-size:10.5px;color:var(--muted);font-weight:600}
</style></head><body>
<div id="app"><div class="center"><div style="font-size:34px">⚙️</div><p class="msg">Carregando METAS NOVAS…</p></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
var SB_URL="https://gpgycgkqkzedoyilrsmw.supabase.co";
var SB_KEY="sb_publishable_PtttNHZXuxyuV224G5qhQw_ONYW8soj";
var sb=window.supabase.createClient(SB_URL,SB_KEY);
var ME={id:null,nome:'',perfil:''}, TAB='regras', SETOR='EXTERNO', canEdit=false, canImport=false;
var el=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(m){var t=el('toast');t.innerHTML=m;t.classList.add('on');clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.remove('on');},2600);}
function n(v){v=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(v)?v:0;}

async function boot(){
  try{
    var s=await sb.auth.getSession();
    var u=s.data&&s.data.session&&s.data.session.user;
    if(!u){return gateLogin();}
    ME.id=u.id;
    try{var r=await sb.from('usuarios').select('nome,role,permissoes').eq('id',u.id).maybeSingle();
      if(r.data){ME.nome=r.data.nome||u.email;ME.perfil=(r.data.permissoes&&r.data.permissoes.perfil)||(r.data.role==='diretoria'?'diretoria':'');}}catch(e){}
    canEdit=(ME.perfil==='diretoria'||ME.perfil==='rh');
    canImport=(['diretoria','rh','faturamento','supervisao'].indexOf(ME.perfil)>=0);
    shell();
  }catch(e){el('app').innerHTML='<div class="center"><p class="msg">Erro ao iniciar: '+esc(e.message||e)+'</p></div>';}
}
function gateLogin(){
  el('app').innerHTML='<div class="center"><div style="font-size:34px">🔒</div><h2 style="margin:10px 0 4px">Entre pelo portal</h2>'
    +'<p class="msg">O METAS NOVAS usa o seu login do Grupo Uoma. Abra o portal, faça login e volte aqui.</p>'
    +'<a class="btn" style="display:inline-block;text-decoration:none;margin-top:8px" href="entrar.html">Ir para o login</a></div>';
}
function shell(){
  el('app').innerHTML=
    '<div class="top"><div class="brand"><span class="logo">🍦</span>Grupo Uoma · Metas novas</div>'
    +'<h1>METAS NOVAS</h1><div class="who">'+esc(ME.nome)+(canEdit?' · pode editar valores':' · leitura')+'</div></div>'
    +'<div class="tabs">'
    +'<button data-t="regras">⚙️ Regras</button>'
    +'<button data-t="metas">📋 Metas</button>'
    +'<button data-t="camp">🏆 Campanhas</button>'
    +'<button data-t="vend">👤 Vendedor</button>'
    +(canImport?'<button data-t="imp">📥 Importar</button>':'')+'</div>'
    +'<div class="wrap"><div class="pad" id="view"></div></div>';
  document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){TAB=b.dataset.t;paintTabs();render();};});
  paintTabs();render();
}
function paintTabs(){document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===TAB);});}
function render(){ if(TAB==='regras')return renderRegras(); if(TAB==='metas')return renderMetas(); if(TAB==='imp')return renderImp(); if(TAB==='vend')return renderVend(); return renderCamp(); }

/* ===================== REGRAS (ligado de verdade) ===================== */
// Regras comuns aos dois setores (valores diferentes por linha/setor)
var REG_SHARED=[
  {t:'Bônus por meta (valor por meta batida)',f:[['bonus_fat','Faturamento'],['bonus_mix','Mix'],['bonus_posit','Positivação'],['bonus_inad','Inadimplência']]},
  {t:'Inadimplência',f:[['inad_meta','Meta de inadimplência (%)'],['inad_desconta_transito','Descontar o trânsito na inadimplência?','bool']]},
  {t:'Comissão de salário',f:[['com_individual_pct','Individual — % da base'],['com_equipe_ativo','Comissão de equipe ativa?','bool'],['com_equipe_meta_pct','Equipe — atinge a partir de (%)'],['com_equipe_pct_acima','Equipe — % se atingiu'],['com_equipe_pct_abaixo','Equipe — % se não atingiu']]}
];
// Regras exclusivas de cada setor (o outro lado não lê nem mostra)
var REG_BY_SETOR={
  EXTERNO:[
    {t:'Positivação e trava de carteira',f:[['posit_alvo','Positivação — alvo (%)'],['min_clientes','Mínimo de clientes'],['min_carteira','Mínimo da carteira (R$)']]},
    {t:'Supervisor externo (só ganha se a equipe bater)',f:[['sup_base_pct','Comissão base (%)'],['sup_pp_fat','p.p. Faturamento'],['sup_pp_inad','p.p. Inadimplência'],['sup_pp_mix','p.p. Mix'],['sup_pp_posit','p.p. Positivação'],['sup_pp_teto','Teto de p.p.']]}
  ],
  INTERNO:[
    {t:'Supervisor interno — R$ por índice batido pela equipe',f:[['sup_val_fat','Faturamento (R$)'],['sup_val_mix','Mix (R$)'],['sup_val_posit','Positivação (R$)'],['sup_val_inad','Inadimplência (R$)']]}
  ]
};
var _reg={};
async function renderRegras(){
  var v=el('view');v.innerHTML='<div class="msg">Carregando regras…</div>';
  var r=await sb.from('metas_regras').select('*');
  if(r.error){v.innerHTML='<div class="empty">Não consegui ler as regras.<br>'+esc(r.error.message)+'</div>';return;}
  _reg={};(r.data||[]).forEach(function(row){_reg[row.setor]=row;});
  if(!_reg[SETOR]){v.innerHTML='<div class="empty">Regras do setor não encontradas. Rode o SQL do METAS NOVAS.</div>';return;}
  var row=_reg[SETOR];
  var html='<div class="seg"><button id="sgE" onclick="setSetor(\'EXTERNO\')">Externa</button><button id="sgI" onclick="setSetor(\'INTERNO\')">Interna</button></div>'
    +'<span class="gate" style="float:right;margin-top:6px">'+(canEdit?'🔓 você edita':'🔒 só RH/Diretoria')+'</span>';
  var groups=REG_SHARED.concat(REG_BY_SETOR[SETOR]||[]);
  groups.forEach(function(g){
    html+='<div class="grp"><div class="grph"><h3>'+esc(g.t)+'</h3></div><div class="grpb">';
    g.f.forEach(function(fld){
      var k=fld[0],lab=fld[1],typ=fld[2]||'num';var val=row[k];
      html+='<div class="fr"><div class="lab">'+esc(lab)+'</div>';
      if(typ==='bool')html+='<input type="checkbox" data-k="'+k+'" '+(val?'checked':'')+' '+(canEdit?'':'disabled')+'>';
      else html+='<input class="f num" data-k="'+k+'" value="'+esc(val==null?0:val)+'" inputmode="decimal" '+(canEdit?'':'disabled')+'>';
      html+='</div>';
    });
    html+='</div></div>';
  });
  // fornecedores
  html+='<div class="grp"><div class="grph"><h3>Bônus por fornecedor</h3><span class="gate">interno · você paga</span></div><div class="grpb" id="fzbox"><div class="msg">Carregando fornecedores…</div></div></div>';
  v.innerHTML=html;
  el('sgE').classList.toggle('on',SETOR==='EXTERNO');el('sgI').classList.toggle('on',SETOR==='INTERNO');
  saveBar(canEdit?'<button class="btn" id="salvar">Salvar regras ('+(SETOR==='EXTERNO'?'Externa':'Interna')+')</button>':'', 'As regras valem por setor. Edição só RH/Diretoria.');
  if(canEdit){el('salvar').onclick=salvarRegras;}
  loadForn();
}
window.setSetor=function(s){SETOR=s;renderRegras();};
async function salvarRegras(){
  var btn=el('salvar');btn.disabled=true;btn.textContent='Salvando…';
  var payload={};document.querySelectorAll('#view [data-k]').forEach(function(inp){
    var k=inp.dataset.k;if(inp.type==='checkbox')payload[k]=inp.checked;else payload[k]=n(inp.value);
  });
  payload.atualizado_em=new Date().toISOString();
  var r=await sb.from('metas_regras').update(payload).eq('setor',SETOR);
  btn.disabled=false;btn.textContent='Salvar regras ('+(SETOR==='EXTERNO'?'Externa':'Interna')+')';
  if(r.error){toast('❌ '+esc(r.error.message));}else{toast('✓ Regras salvas ('+SETOR+')');}
}
async function loadForn(){
  var box=el('fzbox');if(!box)return;
  var r=await sb.from('metas_fornecedor_bonus').select('*').order('marca');
  if(r.error){box.innerHTML='<div class="msg">Erro: '+esc(r.error.message)+'</div>';return;}
  var rows=r.data||[];
  var html='<div class="fzrow fzh"><span>Marca</span><span>Critério</span><span>Ext.R$</span><span>Int.R$</span><span></span></div>';
  html+=rows.map(function(f){return '<div class="fzrow" data-id="'+f.id+'">'
    +'<input class="f" data-c="marca" value="'+esc(f.marca)+'" style="text-align:left" '+(canEdit?'':'disabled')+'>'
    +'<select class="f" data-c="criterio" '+(canEdit?'':'disabled')+'><option value="FAT"'+(f.criterio==='FAT'?' selected':'')+'>Faturamento</option><option value="PESO"'+(f.criterio==='PESO'?' selected':'')+'>Peso</option></select>'
    +'<input class="f num" data-c="valor_externo" value="'+esc(f.valor_externo)+'" inputmode="decimal" '+(canEdit?'':'disabled')+'>'
    +'<input class="f num" data-c="valor_interno" value="'+esc(f.valor_interno)+'" inputmode="decimal" '+(canEdit?'':'disabled')+'>'
    +(canEdit?'<button class="rm" onclick="delForn('+f.id+')">🗑</button>':'<span></span>')
    +'</div>';}).join('');
  if(!rows.length)html+='<div class="msg">Nenhum fornecedor ainda.</div>';
  if(canEdit)html+='<div style="display:flex;gap:8px;margin-top:10px"><button class="btn sec" id="fzadd">+ adicionar fornecedor</button><button class="btn" id="fzsave">Salvar fornecedores</button></div>';
  box.innerHTML=html;
  if(canEdit){el('fzadd').onclick=addForn;el('fzsave').onclick=saveForn;}
}
window.delForn=async function(id){if(!confirm('Apagar esse fornecedor?'))return;var r=await sb.from('metas_fornecedor_bonus').delete().eq('id',id);if(r.error)toast('❌ '+esc(r.error.message));else{toast('✓ Apagado');loadForn();}};
async function addForn(){var r=await sb.from('metas_fornecedor_bonus').insert({marca:'NOVA MARCA',criterio:'FAT',valor_externo:0,valor_interno:0});if(r.error)toast('❌ '+esc(r.error.message));else{toast('✓ Adicionado');loadForn();}}
async function saveForn(){
  var rows=document.querySelectorAll('#fzbox .fzrow[data-id]');var ok=0,err='';
  for(var i=0;i<rows.length;i++){var row=rows[i];var id=+row.dataset.id;var p={};
    row.querySelectorAll('[data-c]').forEach(function(inp){var c=inp.dataset.c;p[c]=(c==='marca'||c==='criterio')?inp.value:n(inp.value);});
    var r=await sb.from('metas_fornecedor_bonus').update(p).eq('id',id);if(r.error)err=r.error.message;else ok++;}
  toast(err?('❌ '+esc(err)):('✓ '+ok+' fornecedor(es) salvos'));
}

/* ===================== METAS (conectado — histórico travado) ===================== */
var MES=null, _mmVend=[], _mmRows={}, _mmMes=[];
function brl(x){return (n(x)).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});}
function pct(a,b){b=n(b);return b>0?Math.round(n(a)/b*100):0;}
async function renderMetas(){
  saveBar('','');
  var v=el('view');
  if(!_mmMes.length){
    v.innerHTML='<div class="msg">Carregando metas…</div>';
    var mr=await sb.from('metas_meses').select('*').order('mes',{ascending:false});
    if(mr.error){v.innerHTML='<div class="empty">Erro ao ler meses: '+esc(mr.error.message)+'</div>';return;}
    _mmMes=mr.data||[];
    if(!_mmMes.length){
      v.innerHTML='<div class="empty">✅ Conectado ao banco.<br><br>Ainda não há <b>meses cadastrados</b>. Publique o SQL <b>metas_seed_janjul.sql</b> para carregar o histórico Jan–Jul travado + os vendedores.</div>';
      return;
    }
    var vr=await sb.from('vendedores').select('*').order('nome');
    _mmVend=vr.data||[];
  }
  if(!MES)MES=_mmMes[0].mes;
  var v_=el('view');v_.innerHTML='<div class="msg">Carregando '+esc(MES)+'…</div>';
  var rr=await sb.from('metas_mensais').select('*').eq('mes',MES);

      +metaRow('Inadimplência', inadp+'% (venc. '+brl(r.vencido)+' / a receber '+brl(r.areceber)+')', null, r.part_inad)
      +'</div></div>';
  });

}

async function ensureCVend(){

  var vr=await sb.from('vendedores').select('*').eq('ativo',true).order('nome');
  _cvend=(vr.data||[]);
  // baseline por vendedor (mês mais recente) p/ pré-preencher meta do critério
  var mm=await sb.from('metas_mensais').select('mes,codigo,obj_fat,obj_mix,carteira,positivados').order('mes',{ascending:false});
  CBASE={};(mm.data||[]).forEach(function(r){ if(!CBASE[r.codigo])CBASE[r.codigo]={'Faturamento':n(r.obj_fat),'Mix (produtos)':n(r.obj_mix),'Positivação':n(r.carteira)||n(r.positivados)}; });
}
function campNew(){CEDIT=null;CIMGS=[];CCRITS=[{ind:'Faturamento',modo:'CRESCIMENTO',p:[500,300,150]}];window._cpart=null;CV='form';renderCamp();}
async function campOpen(id){

      +'<div id="c_crits"></div><button class="addc" onclick="cAddCrit()">+ adicionar critério</button>'
      // participantes
      +'<div class="subhead">👥 Participantes &amp; meta por critério</div><div id="c_parts"></div>'
      +'<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:14px">'

      +'</div></div>';

    html+='<div class="grp"><div class="grph"><h3>🔗 Compartilhamento</h3></div><div class="grpb" id="c_share">'

function optMarcas(sel){return '<option value="">— escolher —</option>'+MARCAS.map(function(m){return '<option'+(m===sel?' selected':'')+'>'+esc(m)+'</option>';}).join('');}
function cScopeVal(){var e=el('c_escopo');return e?e.value:'TODOS';}
window.cScope=function(){cRenderParts();};
function cRenderCrits(){
  el('c_crits').innerHTML=CCRITS.map(function(c,i){
    var ms=modosFor(c.ind);
    return '<div class="critcard"><div class="ch"><select class="f" onchange="cSetInd('+i+',this.value)">'+INDS.map(function(x){return '<option'+(x===c.ind?' selected':'')+'>'+x+'</option>';}).join('')+'</select>'
      +'<select class="f" onchange="cSetModo('+i+',this.value)">'+ms.map(function(m){return '<option value="'+m[0]+'"'+(m[0]===c.modo?' selected':'')+'>'+m[1]+'</option>';}).join('')+'</select>'
      +(CCRITS.length>1?'<button class="rm" onclick="cDelCrit('+i+')">✕</button>':'')+'</div>'
      +'<div class="podio"><span class="pp">🥇<input class="f" value="'+n(c.p[0])+'" oninput="cSetP('+i+',0,this.value)"></span><span class="pp">🥈<input class="f" value="'+n(c.p[1])+'" oninput="cSetP('+i+',1,this.value)"></span><span class="pp">🥉<input class="f" value="'+n(c.p[2])+'" oninput="cSetP('+i+',2,this.value)"></span></div></div>';
  }).join('');
}
function cMetaCrits(){var o=[];CCRITS.forEach(function(c,i){if(c.modo==='META')o.push({i:i,ind:c.ind});});return o;}
function cPartMap(){ // preserva marcações atuais do DOM
  var m=window._cpart||{};
  document.querySelectorAll('#c_parts [data-part]').forEach(function(cb){m[cb.dataset.part]=cb.checked;});
  window._cpart=m;return m;
}
function cRenderParts(){
  var host=el('c_parts');if(!host)return;
  var scope=cScopeVal();var pm=cPartMap();var mcs=cMetaCrits();
  var list=_cvend.filter(function(v){return scope==='TODOS'||v.setor===scope;});
  host.innerHTML=list.length?list.map(function(vd){
    var checked=(pm[vd.codigo]!==undefined)?pm[vd.codigo]:true;
    var metas=mcs.map(function(mc){
      var key=(CCRITS[mc.i].id||('n'+mc.i))+'_'+vd.codigo;
      var val=(window._cmeta&&window._cmeta[key]!=null)?window._cmeta[key]:((CBASE[vd.codigo]&&CBASE[vd.codigo][mc.ind])||0);
      return '<div style="display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px"><span style="font-size:11px;color:var(--navy);font-weight:700;white-space:nowrap">'+(CICON[mc.ind]||'')+' '+mc.ind.replace(' (produtos)','')+'</span><input class="f num" data-meta="'+mc.i+'_'+vd.codigo+'" value="'+n(val)+'" inputmode="decimal" style="width:84px"></div>';
    }).join('');

      +'<input type="checkbox" data-part="'+vd.codigo+'" '+(checked?'checked':'')+' onchange="cPartMap()">'
      +'<span style="flex:1;font-size:13.5px;font-weight:600">'+esc(vd.nome)+' <span style="font-size:11px;color:var(--muted);font-weight:400">'+(vd.setor==='EXTERNO'?'Externa':'Interna')+'</span></span></div>'

window.cSetInd=function(i,v){CCRITS[i].ind=v;if(modosFor(v).map(function(m){return m[0];}).indexOf(CCRITS[i].modo)<0)CCRITS[i].modo='CRESCIMENTO';cRenderCrits();cRenderParts();};
window.cSetModo=function(i,v){CCRITS[i].modo=v;cRenderParts();};
window.cSetP=function(i,k,v){CCRITS[i].p[k]=n(v);};
window.cAddCrit=function(){cPartMap();CCRITS.push({ind:'Positivação',modo:'META',p:[150,100,50]});cRenderCrits();cRenderParts();};
window.cDelCrit=function(i){cPartMap();CCRITS.splice(i,1);cRenderCrits();cRenderParts();};
window.cImgs=function(files){var a=[].slice.call(files||[]);var l=a.length;if(!l)return;a.forEach(function(f){var rd=new FileReader();rd.onload=function(){CIMGS.push(rd.result);l--;if(l<=0)cRenderThumbs();};rd.readAsDataURL(f);});el('c_img').value='';};
function cRenderThumbs(){var t=el('c_thumbs');if(!t)return;t.innerHTML=CIMGS.map(function(s,i){return '<div class="thumb"><img src="'+s+'"><button class="del" onclick="event.stopPropagation();cDelImg('+i+')">✕</button></div>';}).join('');}

async function campSave(){
  var btn=el('c_save');btn.disabled=true;btn.textContent='Salvando…';
  cPartMap();
  var parent={nome:el('c_nome').value||el('c_forn').value||'Campanha', fornecedor:el('c_forn').value||null,
    marcas:el('c_marca').value?[el('c_marca').value]:[], ini:el('c_ini').value||null, fim:el('c_fim').value||null,
    escopo:cScopeVal(), minimo:n(el('c_min').value), sup_valor:n(el('c_sup').value), imagens:CIMGS, ativa:true};
  // colher metas do DOM por (critIdx, codigo)
  var metaByIdx={};document.querySelectorAll('#c_parts [data-meta]').forEach(function(inp){metaByIdx[inp.dataset.meta]=n(inp.value);});
  var pm=window._cpart||{};
  var partCods=_cvend.filter(function(v){var s=cScopeVal();return (s==='TODOS'||v.setor===s)&&(pm[v.codigo]!==false);}).map(function(v){return v.codigo;});
  try{
    var cid;
    if(CEDIT){
      cid=CEDIT.id;
      var up=await sb.from('campanhas').update(parent).eq('id',cid);if(up.error)throw up.error;
      await sb.from('campanha_criterios').delete().eq('campanha_id',cid);   // cascata apaga metas
      await sb.from('campanha_participantes').delete().eq('campanha_id',cid);
    }else{
      var ins=await sb.from('campanhas').insert(parent).select('id,token_forn,token_colab').single();if(ins.error)throw ins.error;
      cid=ins.data.id;CEDIT=Object.assign({id:cid},ins.data,parent);
    }
    // participantes
    if(partCods.length){var pins=await sb.from('campanha_participantes').insert(partCods.map(function(cd){return {campanha_id:cid,codigo:cd,participa:true};}));if(pins.error)throw pins.error;}
    // criterios (+ metas por critério META)
    for(var i=0;i<CCRITS.length;i++){var c=CCRITS[i];
      var ci=await sb.from('campanha_criterios').insert({campanha_id:cid,indicador:c.ind,modo:c.modo,premio1:n(c.p[0]),premio2:n(c.p[1]),premio3:n(c.p[2]),ordem:i}).select('id').single();
      if(ci.error)throw ci.error;
      if(c.modo==='META'){var rows=partCods.map(function(cd){return {criterio_id:ci.data.id,codigo:cd,meta:(metaByIdx[i+'_'+cd]||0)};});
        if(rows.length){var mi=await sb.from('campanha_metas').insert(rows);if(mi.error)throw mi.error;}}
    }
    toast('✓ Campanha salva');
    // recarrega a campanha (pega tokens) e mostra links
    var fresh=await sb.from('campanhas').select('*').eq('id',cid).maybeSingle();if(fresh.data){CEDIT=fresh.data;if(el('c_share'))el('c_share').innerHTML=shareBlock(fresh.data);}
    if(el('c_del')){}else if(el('c_save')){var bar=el('c_save').parentNode;if(!el('c_del')){var d=document.createElement('button');d.className='btn sec';d.id='c_del';d.textContent='🗑 Apagar';d.onclick=campDelete;bar.appendChild(d);}}
  }catch(e){toast('❌ '+esc(e.message||e));}
  btn.disabled=false;btn.textContent='💾 Salvar campanha';
}
async function campDelete(){
  if(!CEDIT||!confirm('Apagar esta campanha?'))return;
  var r=await sb.from('campanhas').delete().eq('id',CEDIT.id);
  if(r.error){toast('❌ '+esc(r.error.message));return;}
  toast('✓ Campanha apagada');CV='list';renderCamp();
}
function shareBlock(c){
  var base=origin+cpath+'campanha.html';
  var lf=base+'?forn='+encodeURIComponent(c.token_forn||'');
  var lc=base+'?colab='+encodeURIComponent(c.token_colab||'');
  return '<div class="msg" style="padding:2px 0 8px">Os links levam à página da campanha (regras + acompanhamento). O do fornecedor é <b>só leitura</b> e <b>expira no fim</b>.</div>'
    +'<div style="font-size:12px;font-weight:700;color:var(--navy)">🏭 Fornecedor</div><div class="clink">'+esc(lf)+'</div>'
    +'<div style="font-size:12px;font-weight:700;color:var(--navy);margin-top:8px">👥 Colaboradores</div><div class="clink">'+esc(lc)+'</div>'
    +'<div class="msg" style="padding:8px 0 0">A página pública <b>campanha.html</b> (o que fornecedor/colaborador abrem) entra junto com o visual dos vendedores — a estrutura e os links já ficam prontos aqui.</div>';
}

/* ===================== VENDEDOR (visão da carteira, dados reais) ========= */
var VMES=null, VCOD=null, _vlist=[], _vmeses=[];
function money(x){return 'R$ '+brl(x);}
async function renderVend(){
  saveBar('','');
  var v=el('view');
  if(!_vlist.length){
    v.innerHTML='<div class="msg">Carregando…</div>';
    var d=await sb.from('desempenho').select('competencia,codigo,vendedor').order('competencia',{ascending:false}).order('vendedor');
    if(d.error){v.innerHTML='<div class="empty">Erro: '+esc(d.error.message)+'</div>';return;}
    var rows=d.data||[];
    if(!rows.length){v.innerHTML='<div class="empty">✅ Conectado. Ainda não há dados importados.<br>Vá em <b>📥 Importar</b> e suba o <b>Desempenho</b> e o <b>Mix/Faturamento</b> do mês.</div>';return;}
    _vmeses=[];rows.forEach(function(r){if(_vmeses.indexOf(r.competencia)<0)_vmeses.push(r.competencia);});
    _vlist=rows;
  }
  if(!VMES)VMES=_vmeses[0];
  var vends=_vlist.filter(function(r){return r.competencia===VMES;});
  if(!VCOD||!vends.some(function(r){return r.codigo===VCOD;}))VCOD=vends.length?vends[0].codigo:null;

  var head='<div style="display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px">'
    +'<select class="f" id="vMes" style="width:auto">'+_vmeses.map(function(m){return '<option'+(m===VMES?' selected':'')+'>'+esc(m)+'</option>';}).join('')+'</select>'
    +'<select class="f" id="vCod" style="width:auto">'+vends.map(function(r){return '<option value="'+esc(r.codigo)+'"'+(r.codigo===VCOD?' selected':'')+'>'+esc(r.vendedor)+' ('+esc(r.codigo)+')</option>';}).join('')+'</select></div>';
  v.innerHTML=head+'<div id="vBody"><div class="msg">Carregando vendedor…</div></div>';
  el('vMes').onchange=function(){VMES=this.value;VCOD=null;renderVend();};
  el('vCod').onchange=function(){VCOD=this.value;paintVend();};
  paintVend();
}
async function paintVend(){
  var host=el('vBody');if(!host)return;host.innerHTML='<div class="msg">Carregando…</div>';
  var de=await sb.from('desempenho').select('*').eq('competencia',VMES).eq('codigo',VCOD).maybeSingle();
  var hist=await sb.from('desempenho').select('competencia,vendas').eq('codigo',VCOD);   // média mensal
  var fv=await sb.from('fat_vendas').select('doc,codcli,nomecli,codpro,descpro,marca,peso,vlrliquido').eq('competencia',VMES).eq('codvendedor',VCOD).limit(20000);
  if(fv.error){host.innerHTML='<div class="empty">Erro: '+esc(fv.error.message)+'</div>';return;}
  var D=de.data||{}; var linhas=fv.data||[];
  var hv=(hist.data||[]);var mediaMes=hv.length?hv.reduce(function(a,r){return a+n(r.vendas);},0)/hv.length:0;
  // agregações da carteira dele
  var totFat=0,totPeso=0, cli={}, pro={}, mar={}, docs={};
  linhas.forEach(function(l){
    var vl=n(l.vlrliquido),pk=n(l.peso);totFat+=vl;totPeso+=pk;
    if(l.doc)docs[l.doc]=1;
    var kc=l.codcli||'?';if(!cli[kc])cli[kc]={nome:l.nomecli||kc,v:0};cli[kc].v+=vl;
    var kp=l.codpro||'?';if(!pro[kp])pro[kp]={nome:l.descpro||kp,v:0,q:0};pro[kp].v+=vl;
    var km=l.marca||'—';if(!mar[km])mar[km]={v:0,p:0};mar[km].v+=vl;mar[km].p+=pk;
  });
  var nDocs=Object.keys(docs).length, nCli=Object.keys(cli).length, nMix=Object.keys(pro).length;
  function top(obj,key,nmk){return Object.keys(obj).map(function(k){return obj[k];}).sort(function(a,b){return b[key]-a[key];}).slice(0,10);}
  var topCli=top(cli,'v'), topPro=top(pro,'v');
  var topMar=Object.keys(mar).map(function(k){return {marca:k,v:mar[k].v,p:mar[k].p,kg:mar[k].p>0?mar[k].v/mar[k].p:0};}).sort(function(a,b){return b.v-a.v;}).slice(0,10);
  var kgGeral=totPeso>0?totFat/totPeso:0;
  var nomeV=(D.vendedor)|| (linhas[0]&&linhas[0].vendedor) || VCOD;

  var h='<div class="top" style="border-radius:14px;margin:0 0 14px"><div class="brand"><span>Minha carteira · '+esc(VMES)+'</span><span class="logo"><span class="ic">🍦</span>Loja do Sorveteiro</span></div>'
    +'<h1 style="font-size:20px">'+esc(nomeV)+'</h1><div class="who">Código '+esc(VCOD)+'</div></div>';

  // KPIs — visão de gerente da própria carteira
  var fatShow=(D.vendas!=null&&n(D.vendas)>0)?n(D.vendas):totFat;
  h+='<div class="h">📊 Minha carteira no mês</div><div class="kgrid">'
    +kbox('Faturamento', money(fatShow), mediaMes>0?('média mensal '+money(mediaMes)):'')
    +kbox('Ticket médio · pedido', nDocs?money(totFat/nDocs):'—', nDocs+' pedidos no mês')
    +kbox('Ticket médio · cliente', nCli?money(totFat/nCli):'—', nCli+' clientes atendidos')
    +kbox('Valor do quilo (geral)', '<span style="color:var(--gold)">'+money(kgGeral)+'</span><small style="font-size:12px;color:var(--muted)"> /kg</small>', brl(totPeso)+' kg vendidos')
    +kbox('Inadimplência', (n(D.inadimplencia)).toLocaleString('pt-BR')+'%', 'vencido '+money(D.vencidos)+' · trânsito à parte')
    +kbox('Mix &amp; carteira', (nMix||n(D.mix_produto))+' produtos', (n(D.carteira_clientes))+' clientes na carteira')
    +kbox('Clientes novos', '<span style="color:var(--good)">+'+(n(D.clientes_novos))+'</span>', 'conquistados no mês')
    +kbox('Não compraram', '<span style="color:var(--miss)">'+(n(D.pct_nao_compraram)).toLocaleString('pt-BR')+'%</span>', (n(D.positivacao))+' positivados · '+(n(D.pct_compraram))+'% compraram')
    +'</div>';

  if(!linhas.length){h+='<div class="empty">Sem linhas de Mix/Faturamento para este vendedor em '+esc(VMES)+'.<br>Importe o <b>Mix/Faturamento</b> do mês para ver top clientes/produtos e o quilo por marca.</div>';host.innerHTML=h;return;}

  // Top clientes
  h+='<div class="h">🏅 Top 10 clientes</div><div class="grp"><div class="grpb">'
    +topCli.map(function(c,i){return '<div class="tl"><span class="rk">'+(i+1)+'</span><span class="nm">'+esc(c.nome)+'</span><span class="vv">'+money(c.v)+'</span></div>';}).join('')+'</div></div>';
  // Top produtos
  h+='<div class="h">📦 Top 10 produtos</div><div class="grp"><div class="grpb">'
    +topPro.map(function(p,i){return '<div class="tl"><span class="rk">'+(i+1)+'</span><span class="nm">'+esc(p.nome)+'</span><span class="vv">'+money(p.v)+'</span></div>';}).join('')+'</div></div>';
  // R$/kg por marca
  h+='<div class="h">⚖️ Valor do quilo por marca</div><div class="grp"><div class="grpb">'
    +topMar.map(function(m,i){return '<div class="tl"><span class="rk">'+(i+1)+'</span><span class="nm">'+esc(m.marca)+'<div class="d">'+brl(m.p)+' kg · '+money(m.v)+'</div></span><span class="vv gold" style="color:var(--gold)">'+money(m.kg)+' <span class="u">/kg</span></span></div>';}).join('')+'</div></div>';

  h+='<div class="msg" style="margin-top:14px">As <b>metas do mês e o bônus</b> (Bloco 2) entram aqui quando a competência tiver metas lançadas e os códigos estiverem unificados. Esta tela já é a base da visão de cada vendedor.</div>';
  host.innerHTML=h;
}
function kbox(l,v,s){return '<div class="kbox"><div class="kl">'+l+'</div><div class="kv">'+v+'</div>'+(s?'<div class="ks">'+s+'</div>':'')+'</div>';}

/* ===================== IMPORTAR (planilhas → tabelas do RH) ============== */
var IMPMES=null;
function pbr(v){v=String(v==null?'':v).trim().replace(/\./g,'').replace(',','.');var f=parseFloat(v);return isFinite(f)?f:0;}
function toISO(dmy){var m=String(dmy||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?(m[3]+'-'+m[2]+'-'+m[1]):null;}
function readSmart(file){return new Promise(function(res,rej){var r=new FileReader();r.onerror=function(){rej(new Error('leitura'));};
  r.onload=function(){var buf=r.result;var t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){t=new TextDecoder('iso-8859-1').decode(buf);}res(t);};
  r.readAsArrayBuffer(file);});}
function parseCSV(txt){ // delimitador ; com aspas
  var rows=[],row=[],cur='',q=false,i,c;txt=txt.replace(/\r/g,'');
  for(i=0;i<txt.length;i++){c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else{ if(c==='"')q=true; else if(c===';'){row.push(cur);cur='';} else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';} else cur+=c; }
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){return r.length>1||(r[0]&&r[0].trim());});
}
function hmap(header){var m={};header.forEach(function(h,i){m[h.trim().toUpperCase()]=i;});return m;}

async function renderImp(){
  saveBar('','');
  var v=el('view');
  if(!IMPMES){var d=new Date();IMPMES=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);}
  // status atual
  var fc=await sb.from('fat_vendas').select('competencia',{count:'exact',head:true}).eq('competencia',IMPMES);
  var dc=await sb.from('desempenho').select('competencia',{count:'exact',head:true}).eq('competencia',IMPMES);
  var nf=(fc&&fc.count)||0, nd=(dc&&dc.count)||0;
  v.innerHTML=''
    +'<div class="grp"><div class="grph"><h3>📥 Importar planilhas</h3><span class="gate">'+(canImport?'🔓':'🔒')+'</span></div><div class="grpb">'
    +'<div class="msg">Suba as duas planilhas do mês. Elas alimentam as tabelas do RH — daí saem mix, quilo, top produtos/clientes, carteira, inadimplência etc.</div>'
    +'<div class="fr"><div class="lab">Competência (mês)</div><input class="f" id="impMes" value="'+esc(IMPMES)+'" placeholder="AAAA-MM" style="width:120px;text-align:left"></div>'
    +'</div></div>'
    +'<div class="grp"><div class="grph"><h3>1) Mix / Faturamento</h3><span class="gate">'+nf+' linhas em '+esc(IMPMES)+'</span></div><div class="grpb">'
    +'<div class="msg">Relatório linha a linha (produto · cliente · marca · peso · valor). Reimportar o mesmo mês <b>substitui</b> o que já tinha.</div>'
    +'<div class="uploader" onclick="el(\'fMix\').click()"><input type="file" id="fMix" accept=".csv,.txt" style="display:none" onchange="doImpMix(this.files[0])"><div class="msg" style="padding:0"><b>Toque para subir o Mix/Faturamento</b> (CSV)</div></div>'
    +'<div id="impMixLog" class="msg"></div>'
    +'</div></div>'
    +'<div class="grp"><div class="grph"><h3>2) Desempenho</h3><span class="gate">'+nd+' vendedores em '+esc(IMPMES)+'</span></div><div class="grpb">'
    +'<div class="msg">Relatório por vendedor (vendas · positivação · carteira · média · inadimplência). Reimportar <b>atualiza</b> cada vendedor.</div>'
    +'<div class="uploader" onclick="el(\'fDes\').click()"><input type="file" id="fDes" accept=".csv,.txt" style="display:none" onchange="doImpDes(this.files[0])"><div class="msg" style="padding:0"><b>Toque para subir o Desempenho</b> (CSV)</div></div>'
    +'<div id="impDesLog" class="msg"></div>'
    +'</div></div>';
  el('impMes').onchange=function(){IMPMES=this.value.trim();renderImp();};
}
window.doImpMix=async function(file){
  if(!file)return;var log=el('impMixLog');log.innerHTML='Lendo arquivo…';
  try{
    var txt=await readSmart(file);var rows=parseCSV(txt);if(rows.length<2)throw new Error('vazio');
    var H=hmap(rows[0]);var need=['CODVENDEDOR','MARCA','CODCLI','VLRLIQUIDO','PESO'];
    for(var k=0;k<need.length;k++)if(H[need[k]]==null)throw new Error('coluna '+need[k]+' não encontrada — é o Mix/Faturamento certo?');
    var recs=[];for(var i=1;i<rows.length;i++){var r=rows[i];if(!r||r.length<3||!(r[H.CODPRO]||r[H.CODVENDEDOR]))continue;
      recs.push({competencia:IMPMES,data:toISO(r[H.DATA]),doc:(r[H.DOC]||'').trim(),empresa:(r[H.EMP]||'').trim(),
        codpro:(r[H.CODPRO]||'').trim(),descpro:(r[H.DESCPRO]||'').trim(),embalagem:(r[H.EMBALAGEM]||'').trim(),
        marca:(r[H.MARCA]||'').trim(),codcli:(r[H.CODCLI]||'').trim(),nomecli:(r[H.NOMECLI]||'').trim(),
        codvendedor:(r[H.CODVENDEDOR]||'').trim(),vendedor:(r[H.VENDEDOR]||'').trim(),
        quantidade:pbr(r[H.QUANTIDADE]),peso:pbr(r[H.PESO]),vlrliquido:pbr(r[H.VLRLIQUIDO]),tipooperacao:(r[H.TIPOOPERACAO]||'').trim()});
    }
    log.innerHTML='Substituindo '+esc(IMPMES)+' e gravando '+recs.length+' linhas…';
    var del=await sb.from('fat_vendas').delete().eq('competencia',IMPMES);if(del.error)throw del.error;
    for(var j=0;j<recs.length;j+=500){var ins=await sb.from('fat_vendas').insert(recs.slice(j,j+500));if(ins.error)throw ins.error;log.innerHTML='Gravando… '+Math.min(j+500,recs.length)+'/'+recs.length;}
    log.innerHTML='✅ '+recs.length+' linhas importadas em '+esc(IMPMES)+'.';toast('✓ Mix importado');renderImp();
  }catch(e){log.innerHTML='❌ '+esc(e.message||e);toast('❌ '+esc(e.message||e));}
};
window.doImpDes=async function(file){
  if(!file)return;var log=el('impDesLog');log.innerHTML='Lendo arquivo…';
  try{
    var txt=await readSmart(file);var rows=parseCSV(txt);if(rows.length<2)throw new Error('vazio');
    var H=hmap(rows[0]);if(H.CODIGO==null||H.VENDAS==null)throw new Error('não parece o Relatório de Desempenho');
    var recs=[];for(var i=1;i<rows.length;i++){var r=rows[i];var cod=(r[H.CODIGO]||'').trim();if(!cod)continue;
      recs.push({competencia:IMPMES,empresa:(r[H.EMPRESA]||'').trim(),codigo:cod,vendedor:(r[H.VENDEDOR]||'').trim(),
        vendas:pbr(r[H.VENDAS]),custo:pbr(r[H.CUSTO]),lucro:pbr(r[H.LUCRO]),positivacao:pbr(r[H.POSITIVACAO]),
        venda_media:pbr(r[H.VENDAMEDIA]),peso:pbr(r[H.PESO]),mix_produto:pbr(r[H.MIXPRODUTO]),
        carteira_clientes:pbr(r[H.CARTEIRACLIENTES]),clientes_atendidos:pbr(r[H.CLIENTESATENDIDOS]),
        qtd_devolucao:pbr(r[H.QTDDEVOLUCAO]),pct_compraram:pbr(r[H.POR_CLIENTECOMPRARAM]),
        pct_nao_compraram:pbr(r[H.CLIENTESNAOCOMPRARAM]),clientes_novos:pbr(r[H.CLIENTESNOVOS]),
        areceber:pbr(r[H.ARECEBER]),a_vencer:pbr(r[H.TOTALAVENCER]),vencidos:pbr(r[H.TOTALVENCIDOS]),
        transito:pbr(r[H.TOTALTRANSITO]),inadimplencia:pbr(r[H.INADIMPLENCIA]),atualizado_em:new Date().toISOString()});
    }
    log.innerHTML='Gravando '+recs.length+' vendedores…';
    var up=await sb.from('desempenho').upsert(recs,{onConflict:'competencia,codigo'});if(up.error)throw up.error;
    log.innerHTML='✅ '+recs.length+' vendedores importados em '+esc(IMPMES)+'.';toast('✓ Desempenho importado');renderImp();
  }catch(e){log.innerHTML='❌ '+esc(e.message||e);toast('❌ '+esc(e.message||e));}
};

function saveBar(right,msg){
  var old=el('savebar');if(old)old.remove();
  if(!right&&!msg)return;
  var d=document.createElement('div');d.className='savebar';d.id='savebar';
  d.innerHTML='<span class="m">'+(msg||'')+'</span>'+(right||'');
  document.body.appendChild(d);
}
boot();
</script></body></html>
